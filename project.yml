name: Sublimito
options:
  bundleIdPrefix: com.arturo
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
packages:
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    from: 2.9.0
targets:
  Sublimito:
    type: application
    platform: macOS
    dependencies:
      - package: Sparkle
    sources:
      - path: Sources/Sublimito
      - path: Resources
        buildPhase: resources
      - path: monaco
        type: folder
        buildPhase: resources
    info:
      path: Sources/Sublimito/Info.plist
      properties:
        CFBundleName: Sublimito
        CFBundleDisplayName: Sublimito
        CFBundleShortVersionString: "1.1.0"
        CFBundleVersion: "2"
        SUFeedURL: https://raw.githubusercontent.com/arturogj92/sublimito/master/appcast.xml
        LSMinimumSystemVersion: "14.0"
        NSHumanReadableCopyright: "© 2026 Arturo Garcia"
        NSHighResolutionCapable: true
        CFBundleIconName: AppIcon
        NSMainStoryboardFile: ""
        CFBundleDocumentTypes:
          - CFBundleTypeName: Text Document
            CFBundleTypeRole: Editor
            LSHandlerRank: Alternate
            LSItemContentTypes:
              - public.plain-text
              - public.text
              - net.daringfireball.markdown
              - public.data
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.arturo.Sublimito
        MARKETING_VERSION: "1.1.0"
        CURRENT_PROJECT_VERSION: "2"
        SWIFT_VERSION: "5.9"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_IDENTITY: "-"
        CODE_SIGN_STYLE: Manual
        DEVELOPMENT_TEAM: ""
        ENABLE_HARDENED_RUNTIME: true
        COMBINE_HIDPI_IMAGES: true
