name: Sublimito
options:
  bundleIdPrefix: com.arturo
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
targets:
  Sublimito:
    type: application
    platform: macOS
    sources:
      - path: Sources/Sublimito
      - path: Resources
        buildPhase: resources
    info:
      path: Sources/Sublimito/Info.plist
      properties:
        CFBundleName: Sublimito
        CFBundleDisplayName: Sublimito
        CFBundleShortVersionString: "1.0.0"
        CFBundleVersion: "1"
        LSMinimumSystemVersion: "14.0"
        NSHumanReadableCopyright: "© 2026 Arturo Garcia"
        NSHighResolutionCapable: true
        CFBundleIconName: AppIcon
        NSMainStoryboardFile: ""
        CFBundleDocumentTypes:
          - CFBundleTypeName: Text Document
            CFBundleTypeRole: Editor
            LSHandlerRank: Alternate
            LSItemContentTypes:
              - public.plain-text
              - public.text
              - net.daringfireball.markdown
              - public.data
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.arturo.Sublimito
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.9"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_IDENTITY: "-"
        CODE_SIGN_STYLE: Manual
        DEVELOPMENT_TEAM: ""
        ENABLE_HARDENED_RUNTIME: false
        COMBINE_HIDPI_IMAGES: true
